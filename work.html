<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<title>Kim Gaeun</title>
<!-- 예전 프로젝트 세부 페이지 주소입니다. 2026-11-22부터 세부 화면은 첫 화면 하나뿐이라(카드를 누르면 그 자리에서 커짐),
     예전 링크(work.html?p=<slug>)는 첫 화면의 같은 작품(./#<slug>)으로 넘겨 줍니다. 카드가 없는 작품은 첫 화면으로 갑니다. -->
<script>
  (function () {
    var p = '';
    try { p = new URLSearchParams(location.search).get('p') || decodeURIComponent(location.hash.slice(1)); } catch (_) {}
    location.replace('./' + (p ? '#' + encodeURIComponent(p) : ''));
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=./"></noscript>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body>
<p><a href="./">Kim Gaeun · Works</a></p>
</body>
</html>
